<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMart - Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo"><img src="images/leaf.svg" alt="Leaf Logo" style="width: 28px; height: 28px; vertical-align: middle; margin-right: 5px;"> SmartMart</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="nav-actions">
            <img src="images/search.svg" id="navSearchIcon" style="width: 20px; height: 20px; cursor: pointer; vertical-align: middle;" alt="Search">
            <a href="cart.html" class="cart-icon" style="text-decoration: none;">
                <img src="images/cart.svg" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;" alt="Cart">
                <span class="cart-badge" style="display: none;">0</span>
                <span class="cart-text">Cart</span>
            </a>
        </div>
    </header>

    <section class="section-container" style="margin-top: 40px; min-height: 60vh;">
        <div class="section-header">
            <h2>Your Shopping Cart</h2>
        </div>
        
        <div id="cart-items-container">
        </div>

        <div id="empty-cart-message" style="display: none; text-align: center; padding: 50px 0;">
            <i class="fa-solid fa-cart-arrow-down" style="font-size: 60px; color: #ccc; margin-bottom: 20px;"></i>
            <h3 style="color: #666; margin-bottom: 15px;">Your cart is empty</h3>
            <a href="products.html" class="shop-btn" style="display: inline-flex; margin: 0 auto;">Start Shopping</a>
        </div>

        <div id="cart-summary" class="cart-summary" style="display: none;">
            <div class="summary-row">
                <span>Total Items:</span>
                <span id="total-items">0</span>
            </div>
            <div class="summary-row total-price">
                <span>Total Price:</span>
                <span id="total-price">RM 0.00</span>
            </div>
            <button class="shop-btn" style="width: 100%; justify-content: center; border-radius: 8px;" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-links">
                <h3>SmartMart</h3>
                <p style="color:#aaa; font-size:14px; margin-top:10px;">Good Food • Better Life</p>
            </div>
            
            <div class="footer-links">
                <h3>Quick Links</h3>
                <div class="quick-links-grid">
                    <a href="index.html">Home</a>
                    <a href="products.html">Products</a>
                    <a href="categories.html">Categories</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
            
            <div class="footer-contact">
                <h3>Contact Us</h3>
                <p><i class="fa-solid fa-phone"></i> +60 12 345 6789</p>
                <p><i class="fa-solid fa-envelope"></i> support@smartmart.com</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
